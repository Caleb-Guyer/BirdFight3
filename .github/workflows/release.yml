name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        shell: pwsh
        run: ./scripts/test.cmd -NoAudioAudit

      - name: Build distribution package
        shell: pwsh
        run: ./mvnw.cmd -B -ntp package -DskipTests

      - name: Verify distribution package
        shell: pwsh
        run: ./scripts/verify-dist.cmd

      - name: Audit bundled audio
        shell: pwsh
        run: ./scripts/audit-sounds.cmd -OutputPath audit/audio-audit.md -FailOnFindings

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/*-dist.zip
            audit/audio-audit.md
          fail_on_unmatched_files: true
