name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify release metadata
        shell: pwsh
        run: |
          [xml]$pom = Get-Content pom.xml
          $projectVersion = [string]$pom.project.version
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart("v")
          if ($projectVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match pom.xml version $projectVersion."
          }
          $notesPath = "docs/releases/$($env:GITHUB_REF_NAME).md"
          if (-not (Test-Path $notesPath)) {
            throw "Release notes are missing: $notesPath"
          }

      - name: Run tests
        shell: pwsh
        run: ./scripts/test.cmd -NoAudioAudit

      - name: Build distribution package
        shell: pwsh
        run: ./mvnw.cmd -B -ntp package -DskipTests

      - name: Verify distribution package
        shell: pwsh
        run: ./scripts/verify-dist.cmd

      - name: Audit bundled audio
        shell: pwsh
        run: ./scripts/audit-sounds.cmd -OutputPath audit/audio-audit.md -FailOnFindings

      - name: Build Windows portable package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          ./build-installer.ps1 -AppVersion $version

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            target/*-dist.zip
            target/BirdFight3-*-win.zip
            audit/audio-audit.md
          fail_on_unmatched_files: true
