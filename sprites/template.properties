# BirdFight3 sprite sheet template
# Rename template.png/.properties to a bird name (e.g. pigeon.png,
# pigeon.properties) and press F12 in Training mode to see it in game.
# Layout: one animation per row, frames left to right, art faces RIGHT.
# Only 'idle' is required; missing states fall back automatically.

frameWidth=80
frameHeight=80
scale=1.0

idle.row=0
idle.frames=4
idle.ticksPerFrame=8

run.row=1
run.frames=4
run.ticksPerFrame=8

flap.row=2
flap.frames=4
flap.ticksPerFrame=8

fall.row=3
fall.frames=4
fall.ticksPerFrame=8

attack.row=4
attack.frames=4
attack.ticksPerFrame=8
attack.loop=false

hitstun.row=5
hitstun.frames=4
hitstun.ticksPerFrame=8
hitstun.loop=false

shield.row=6
shield.frames=4
shield.ticksPerFrame=8

dodge.row=7
dodge.frames=4
dodge.ticksPerFrame=8

ko.row=8
ko.frames=4
ko.ticksPerFrame=8
ko.loop=false

